html<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 GitHub 線上相簿</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f5f5f5; padding: 20px; }
        h1 { color: #333; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 1000px; margin: 0 auto; }
        .photo-card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 250px; }
        .photo-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>📸 我的線上相簿</h1>
    <p>歡迎來到我的 GitHub Pages 圖片展示</p>

    <div class="gallery">
        <!-- 複製下方這行，有幾張照片就貼幾次，並修改成您的資料夾名稱與照片檔名 -->
        <div class="photo-card">
            <img src="./ROX/公會祈福_01.png" alt="公會祈福_01">
        </div>
        <div class="photo-card">
            <img src="./ROX/公會祈福_02.png" alt="公會祈福_02">
        </div>
    </div>

</body>
</html>
